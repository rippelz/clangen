# ClanGen Auto Life — autoplay settings
# Delete a line to fall back to its default.

[autoplay]
# Start the game straight into autoplay (no menus).
enabled = true
# Global pacing multiplier. 2.0 = everything happens twice as fast, 0.5 = half speed.
speed = 1.0
# Seconds of no clicks/keys before autoplay takes the wheel again after you interact.
idle_resume_seconds = 45
# Mode for clans that autoplay founds: "classic", "expanded" or "cruel_season".
new_clan_mode = "expanded"
# When a clan dies out, found a new one automatically.
restart_on_game_over = true
# Save the clan after every moon.
save_every_moon = true

[pacing]
# Seconds of free time in camp at the start of each moon (and a little more before dusk).
camp_seconds = 18
# Average seconds between thought bubbles in camp.
thought_interval = 3.5
# Patrols attempted each moon (actual count also depends on how many cats can go).
min_patrols = 1
max_patrols = 3
# Reading speed for story text, in characters per second (cards stay up longer for long text).
reading_cps = 28
# Minimum seconds a story card stays up.
card_min_seconds = 4.5

[story]
# Events below this importance get a small card instead of a full one (1-3).
card_min_importance = 2

[history]
# Moons fast-forwarded when autoplay founds a clan, so it starts with some lore
# (births, deaths, leaders) already in the Chronicle. 0 starts from moon 0.
new_clan_moons = 24
# Moons skipped when you press the fast-forward hotkey.
skip_moons = 12

[display]
# "fullscreen": fill the monitor (16:9 or whatever it is), story panels in the side margins.
# "window": a widescreen window of window_size. "classic": ClanGen's own 800x700 window.
# F11 still switches between fullscreen and the window.
mode = "fullscreen"
window_size = [1600, 900]

[hotkeys]
# F6 toggles autoplay, F7 cycles speed, F8 skips the current scene,
# F9 fast-forwards [history] skip_moons moons.
toggle = "f6"
speed = "f7"
skip = "f8"
fast_forward = "f9"
